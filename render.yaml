# BizBuddy — ONE service, ONE URL
# Deploy: Render Dashboard → New → Blueprint → select this repo
# Or: New → Web Service → Docker → this repo root

services:
  - type: web
    name: bizbuddy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Your existing Supabase Postgres (required for Mart1)
      - key: DATABASE_URL
        sync: false
      # CORS — same origin works; leave empty or set to your Render URL
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"

# No Render Postgres needed — use your Supabase DATABASE_URL
