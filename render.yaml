services:
  # =====================
  # Mart1 - Inventory & Billing (FastAPI + React)
  # =====================
  - type: web
    name: mart1-api
    rootDir: mart1
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mart1-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://mart1-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.0"

  - type: static
    name: mart1-frontend
    rootDir: mart1/frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://mart1-api.onrender.com/api

  # =====================
  # Supermarket - Analytics & Dashboard (Flask)
  # =====================
  - type: web
    name: supermarket-flask
    rootDir: supermarket
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Optional: uncomment later if you want Postgres instead of SQLite
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: supermarket-db
      #     property: connectionString

databases:
  - name: mart1-db
    databaseName: mart1_db
    user: mart1_user
    plan: free
