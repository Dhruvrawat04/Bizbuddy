worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    upstream mart1_api {
        server 127.0.0.1:8000;
    }
    upstream supermarket_app {
        server 127.0.0.1:5001;
    }

    server {
        listen 10000;
        server_name _;

        # Mart1 FastAPI — routes already use /api/*
        # ^~ prevents the static-file regex below from stealing /api/*.json etc.
        location ^~ /api/ {
            proxy_pass http://mart1_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Supermarket Flask — app is mounted at /supermarket in WSGI
        # ^~ is required: without it, *.js/*.css under /supermarket/static/ are
        # handled by the SPA static regex and 404 (React build has no those files).
        location ^~ /supermarket/ {
            proxy_pass http://supermarket_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /supermarket {
            return 301 /supermarket/;
        }

        # Mart1 React SPA
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
